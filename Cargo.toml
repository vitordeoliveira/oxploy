[package]
name = "oxploy"
version = "0.5.1"
edition = "2024"

[dependencies]
argon2 = "0.6"
base64 = "0.23.1"
getrandom = "0.4.3"
jiff = "0.2.39"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
libc = "0.2.191"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sysinfo = { version = "0.40", default-features = false, features = ["disk", "network", "system"] }
toasty = { version = "0.11", features = ["migration", "sqlite"] }
toasty-cli = "0.11"
tokio = { version = "1.51.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
topcoat = { version = "0.11.0", default-features = false, features = ["asset", "cookie", "discover", "font-fontsource", "icon-iconify", "router", "runtime", "serve", "session", "tailwind", "ui", "view"] }
topcoat-asset = { version = "0.11.0", features = ["bundler"] }
ureq = { version = "3.5.1", default-features = false, features = ["json", "rustls"] }

[build-dependencies]
topcoat = { version = "0.11.0", default-features = false, features = ["icon-iconify", "tailwind"] }

# Speed up compilation while keeping file and line numbers in error backtraces.
[profile.dev]
debug = "line-tables-only"

# Speed up compilation by skipping debug information for dependencies.
[profile.dev.package."*"]
debug = false
